# CasterManager: friendly PipeWire names for the RØDECaster Duo, Pro II (Pro Audio profile)
# and the Streamer X.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by install.sh.
#
# Only the description shown in OBS / system settings changes; node.name stays the
# same, so apps that already point at the device keep working.
#   pro-input-0  (2 ch)  -> USB 1 Chat
#   pro-input-1          -> all individual channels (multitrack)

monitor.alsa.rules = [
  # --- RØDECaster Duo ---
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*pro-input-0" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Chat"
        node.nick = "Duo Chat"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*pro-output-0" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Chat"
        node.nick = "Duo Chat"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Multitrack"
        node.nick = "Duo Multitrack"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*pro-output-1" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Multitrack"
        node.nick = "Duo Multitrack"
      }
    }
  },

  # --- RØDECaster Pro II ---
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Pro_II_.*pro-input-0" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Pro Chat"
        node.nick = "Pro Chat"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Pro_II_.*pro-output-0" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Pro Chat"
        node.nick = "Pro Chat"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Pro_II_.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Pro Multitrack"
        node.nick = "Pro Multitrack"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Pro_II_.*pro-output-1" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Pro Multitrack"
        node.nick = "Pro Multitrack"
      }
    }
  },
  # Streamer X: playback device ("Analog Surround 4.0" in multitrack mode, stereo otherwise)
  {
    matches = [
      { node.name = "~alsa_output.usb-RODE_Streamer_X_.*" }
    ]
    actions = {
      update-props = {
        node.description = "Streamer X Chat"
        node.nick = "Streamer X Chat"
      }
    }
  },
  # Streamer X: 9-channel USB multitrack capture
  {
    matches = [
      { node.name = "~alsa_input.usb-RODE_Streamer_X_.*multichannel.*" }
    ]
    actions = {
      update-props = {
        node.description = "Streamer X Multitrack"
        node.nick = "Streamer X Multitrack"
      }
    }
  }
]
