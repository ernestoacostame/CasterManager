# CasterManager: friendly PipeWire names for the RØDECaster Duo (Pro Audio profile).
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by install.sh.
#
# Only the description shown in OBS / system settings changes; node.name stays the
# same, so apps that already point at the device keep working.
#   pro-input-0  (2 ch)  -> USB 1 Chat
#   pro-input-1  (16 ch) -> all individual channels (multitrack)

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*pro-input-0" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Chat"
        node.nick = "Duo Chat"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.description = "Rodecaster Duo Multitrack"
        node.nick = "Duo Multitrack"
      }
    }
  }
]
