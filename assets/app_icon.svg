<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DF99"/>
      <stop offset="50%" stop-color="#CBA158"/>
      <stop offset="100%" stop-color="#9E7830"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#383840" stroke-width="4"/>

  <!-- Top Dot: Iconic RØDE gold dot -->
  <circle cx="128" cy="46" r="10" fill="url(#gold)"/>

  <!-- Pads Grid (2 columns x 3 rows) -->
  <!-- Row 1 -->
  <rect x="52" y="74" width="68" height="42" rx="10" fill="#FF3C3C" filter="url(#glow)"/>
  <rect x="136" y="74" width="68" height="42" rx="10" fill="#A050E6" filter="url(#glow)"/>

  <!-- Row 2 -->
  <rect x="52" y="126" width="68" height="42" rx="10" fill="#28C850" filter="url(#glow)"/>
  <rect x="136" y="126" width="68" height="42" rx="10" fill="#3C96FF" filter="url(#glow)"/>

  <!-- Row 3 -->
  <rect x="52" y="178" width="68" height="42" rx="10" fill="#FF8C28" filter="url(#glow)"/>
  <rect x="136" y="178" width="68" height="42" rx="10" fill="#E63C78" filter="url(#glow)"/>
</svg>

