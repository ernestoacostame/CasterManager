# RØDECaster Linux USB HID Quirks Configuration
# Prevents device button & screen freeze when closing applications.
# HID_QUIRK_ALWAYS_POLL = 0x00000400
options usbhid quirks=0x19f7:0x0093:0x00000400,0x19f7:0x0050:0x00000400,0x19f7:0x0079:0x00000400,0x19f7:0x0095:0x00000400,0x19f7:0x0037:0x00000400,0x19f7:0x0030:0x00000400,0x19f7:0x0072:0x00000400,0x19f7:0x0078:0x00000400,0x19f7:0x0092:0x00000400,0x19f7:0x0094:0x00000400

